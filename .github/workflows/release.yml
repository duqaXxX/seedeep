# Builds what a user downloads: the tray's installers and the server's executables. A TAG is the
# only thing that publishes: a manual run builds the same artifacts and leaves them on the workflow
# run, so the pipeline can be proven without cutting a release, which is the one step here that
# cannot be taken back.
#
# Both halves come out of ONE tag, which is what lets the digest contract between them skip a
# compatibility matrix (CLAUDE.md, Distribution invariant).
#
# Windows is the reason this exists as CI rather than a script on a laptop. Tauri's own recipe uses
# one runner per platform, and building the Windows installer from a Mac is documented as possible
# for NSIS only "with caveats" and "not tested as much" - never for `.msi`. The macOS half could be
# built locally; it is here so both halves of a version come out of the same commit and the same
# recipe.
#
# Every asset carries the name of the app it belongs to - `seedeep-server_…`, `seedeep-tray_…`. The
# bundler names its output after `productName`, which is `seedeep-tray`, so nothing has to be renamed
# on the way to the release. It used to: both apps were called `seedeep`, and the download page was
# the only surface that told them apart. They are called different things everywhere now - which is
# also what lets a permission dialog name the one that is actually asking.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # THE REHEARSAL, on the pull request that bumps the version - because a tag is irreversible. The
  # `release tags` ruleset forbids moving or deleting one, so a gate that first runs AFTER the tag
  # spends a version number every time it catches something. That is exactly what v0.28.0 was: the
  # gate worked, held the release in a draft and let nobody download a thing, and the number was
  # burnt anyway by an assertion the scripts had wrong. Building and driving the binaries on the
  # bump's own pull request moves the discovery to before the irreversible step.
  #
  # `package.json` because that is the file a release bumps, and the one place the version lives; it
  # also fires on a dependency change, which is not waste - a dependency is precisely what breaks a
  # compile `bun test` cannot see. And the GATE MACHINERY ITSELF, because the v0.28.0 incident lived
  # in `server-lifecycle.sh`: without those paths a change to the gates merged after the bump's run
  # and before the tag is pushed would never be rehearsed at all, and would land straight on the
  # irreversible step.
  #
  # NOTHING here publishes: every writing step and both attestations are `if: ref_type == 'tag'`, so
  # a pull request builds, smokes, survives and drives the executables while touching neither the
  # repository nor a registry. It is the same rehearsal `workflow_dispatch` offers, made automatic -
  # a rehearsal that depends on somebody remembering to run it is the one that was skipped.
  pull_request:
    paths: ['package.json', '.github/workflows/release.yml', '.github/scripts/**']

# A tag run must never be cancelled - it can be halfway through `gh release upload`, and a
# half-populated draft is worse than a slow one. A pull request run is the opposite: `paths` are
# matched against the WHOLE diff, so once `package.json` is in it every later push to that branch
# starts another full matrix - nine jobs, three Tauri builds, and two legs that each sit through ten
# 40-second idle windows. Four pushes to a bump pull request would otherwise queue four of those at
# once, two of them on `windows-11-arm`.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The draft is created here and the assets are uploaded by each build job.
permissions:
  contents: write

jobs:
  # The release the build jobs upload into. Its own job, and it runs even without a tag: `needs`
  # treats a SKIPPED dependency as a reason to skip, so a draft job that vanished on a manual run
  # would take both build jobs with it - and a manual run has to keep building, that is what it is
  # for. So the job always runs and only its one writing step is conditional.
  draft:
    runs-on: ubuntu-latest
    steps:
      # Idempotent on purpose: re-running a tag's workflow must not fail on the release that the
      # first run already created. Through the environment, never interpolated into the command -
      # a ref name is repository input, and a shell that expands it is one that can be told to run
      # something else.
      - if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        # Install instructions, not a disclaimer. Each system interrupts the first launch, and a
        # release note that does not say so lets that interruption read as a broken download - so it
        # carries the gesture that gets past each one, in the words the system actually uses, and
        # never a label about how the build was made.
        run: |
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || \
          gh release create "$TAG" --repo "$REPO" --draft --title "seedeep $TAG" --notes '
          ### The server

          **The easiest way is npm** — nothing else to install if you already have Node or Bun:

          ```sh
          npm i -g seedeep          # or: bun install -g seedeep --trust
          seedeep                   # watch, serve, and open the browser
          ```

          It installs the same executable published below, on a fixed path on your PATH, and sets
          no Gatekeeper quarantine flag — so it is also the way past the macOS refusal described
          under the tray.

          **Without a JS runtime**, download the file for your platform (`seedeep-server_…`) — it
          carries its own runtime and installs nothing. On Windows there are two: `_windows-arm64.exe`
          on a Snapdragon or any other Windows-on-ARM machine, `_windows-x64.exe` on everything else.
          It is a command-line program run from a
          terminal, and a downloaded file never arrives executable, so it takes one `chmod` first:

          ```sh
          chmod +x seedeep-server_*     # macOS and Linux
          ./seedeep-server_*            # watch, serve, and open the browser
          ```

          Double-clicking it instead says *"There is no application set to open the document"* —
          that is the missing execute bit, not a broken download. On macOS the first launch is
          refused too; the way past it is the same gesture as below.

          ### The tray (optional)

          **macOS** — open the `.dmg` and drag **seedeep-tray** to Applications. The first launch is
          refused: macOS says it *"could not verify that seedeep-tray.app is free of malware"*. Open
          **System Settings -> Privacy & Security -> Security** and press **Open Anyway**, then your
          login password. That button is offered for about an hour after the refused attempt, so
          launch the app first and go to Settings second.

          **Windows** — run the `-setup.exe` for your processor: `_arm64-` on a Snapdragon or any
          other Windows-on-ARM machine, `_x64-` on everything else. SmartScreen shows *"Windows
          protected your PC"*: choose **More info -> Run anyway**. It installs for the current user,
          so it never asks for Administrator rights.

          The README has the same steps with more context.'

  tray:
    needs: draft
    # NOT on the rehearsal. Two reasons that point the same way. It adds nothing a pull request does
    # not already have: `ci.yml` compiles the tray's Rust on macOS AND Windows and runs `cargo test`
    # there, so what the rehearsal would add is the Tauri BUNDLER, and the gates being rehearsed are
    # the server's. And it is the larger half of the untrusted code this workflow builds - three
    # Cargo dependency trees and a `build.rs` per runner - which on a pull request would execute
    # while the job holds the write-scoped token that only a tag used to produce. Skipping it here
    # cuts the rehearsal's cost and its blast radius at once, and costs a release nothing: a tag
    # still builds all three installers, and `publish` still waits for them.
    if: github.event_name != 'pull_request'
    strategy:
      # Every leg is reported even when one fails: a release with half its installers is a thing to
      # know about in full, not one failure at a time.
      fail-fast: false
      matrix:
        include:
          # ONE universal DMG rather than one per architecture, so the download page never asks the
          # reader which processor their Mac has - a question people get wrong, and the wrong answer
          # is an app that will not start.
          - runner: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
          # NSIS, not MSI: its default `currentUser` install mode needs no Administrator rights, and
          # a UAC prompt for an unknown publisher is exactly where an unsigned installer loses people.
          - runner: windows-latest
            targets: ''
            args: --bundles nsis
          # NATIVE, not cross-compiled from the x64 runner above - which does carry the ARM64 MSVC
          # tools, so it could have been. Tauri documents installing those tools on the machine that
          # builds, never a host-to-arm64 cross-build, and this leg differs from the one above by
          # its runner alone: no `--target` to pass, nothing to get subtly right. `windows-11-arm`
          # is GA and free on public repositories (2025-08-07) and its image already carries VS
          # 2022, Rust and NSIS. What it produces is `…_arm64-setup.exe`: the installer itself is
          # still x86 under emulation, by Tauri's design, and the app inside it is native arm64.
          - runner: windows-11-arm
            targets: ''
            args: --bundles nsis
    runs-on: ${{ matrix.runner }}
    # A job-level block REPLACES the workflow's, so `contents: write` is restated here or the upload
    # below loses the permission it has today. The other two are what signs the installer's identity.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # `stable`, not the floor in Cargo.toml: that floor exists so a contributor's old toolchain
      # fails readably, and it is not a claim that the release should be built with it.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          # Named here rather than left to the ref: this action reads the toolchain from the input,
          # and the `stable` branch supplies it only as that branch's default - which a commit SHA
          # no longer names. Pinning without this line would make the build depend on a default
          # buried in the pinned action.yml.
          toolchain: stable
          # Both halves of the universal binary. Empty on Windows, where the host target is the
          # only one built.
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: apps/tray/src-tauri

      - run: bun install --frozen-lockfile

      # BUILD ONLY. `tagName` is what makes tauri-action touch the repository at all, and it is
      # deliberately never set: the assets have to be renamed before they are uploaded, so the upload
      # is the step below. `uploadWorkflowArtifacts` is off for the same reason - it would attach the
      # bundler's own names to the run.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Undoes tauri-action's own default of `true`, which would make the bundler run the
          # Finder-prettifying AppleScript even under CI. That step is what failed when this DMG
          # was first built locally, it needs an automatable Finder to succeed, and it applies a
          # window layout this app does not configure - so it can only cost a release, never
          # improve one. With `false` the bundler passes `--skip-jenkins` and the DMG is plain.
          TAURI_BUNDLER_DMG_IGNORE_CI: 'false'
        with:
          projectPath: apps/tray
          # The CLI pinned in the root's devDependencies. `apps/tray` has no package.json of its
          # own, so the action's own detection would find nothing there and install a global copy -
          # a second, unpinned version of the tool that builds what people download.
          tauriScript: bunx tauri
          args: ${{ matrix.args }}
          tagName: ''
          uploadWorkflowArtifacts: false

      # Collected into `dist/`, the same place the server's job puts its own, so both halves of a
      # release are uploaded from one path. `shell: bash` because this runs on the Windows runner
      # too, where the default is PowerShell.
      #
      # No longer a RENAME: `productName` is `seedeep-tray`, so the bundler already writes
      # `seedeep-tray_<version>_universal.dmg` and the copy keeps the name it found. The rename
      # existed because both apps were called `seedeep` and only the download page could tell them
      # apart; they are called different things now, on every surface a user meets.
      #
      # The emptiness check is the point of the step, and it is now the ONLY check of its kind:
      # tauri-action throws "No artifacts were found" only when it was configured to upload
      # something (`if (releaseId || tagName || shouldUploadWorkflowArtifacts)`, src/index.ts) - with
      # both switched off above, a build that produced nothing returns SUCCESSFULLY. So a naming
      # change in Tauri, or a bundle that never appeared, has to stop the release here.
      - name: Collect the installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find apps/tray/src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name 'seedeep-tray_*.dmg' -o -name 'seedeep-tray_*-setup.exe' \) -print0 |
          while IFS= read -r -d '' f; do
            cp "$f" "dist/$(basename "$f")"
          done
          test -n "$(ls -A dist)" || { echo "no bundle matched - has Tauri's naming changed?"; exit 1; }
          ls -l dist

      # Independent of the release, so the artifacts exist whether or not this run published
      # anything - which is what a manual run is for. Named per runner: artifact names are unique
      # within a run, and every matrix leg reaches this step - the two Windows ones included, which
      # is why the runner and not the OS is what names them.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tray-${{ matrix.runner }}
          path: dist/*
          if-no-files-found: error

      # seedeep ships unsigned, so nothing in the installer itself says where it came from. This
      # does: it records, in a public transparency log, that THIS file was built by THIS workflow
      # from THIS commit, and `gh attestation verify <file> -R duqaXxX/seedeep` checks it against a
      # download. Only on a tag, and before the upload, so what is attested is the file that ships.
      - if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # `--clobber` for the same reason the draft is created idempotently: "Re-run all jobs" is the
      # standard recovery gesture after a flaky runner, and without it the second run dies on the
      # assets the first one already uploaded (gh: "Delete and re-upload existing assets of the same
      # name"; the API answers 422 otherwise) - leaving the release a draft nobody can publish
      # without deleting assets by hand. What it overwrites came from a fresh build in this same run.
      - if: github.ref_type == 'tag'
        # `shell: bash` for the same reason the rename step above declares it, and it is not
        # cosmetic: this job's matrix includes the Windows runner, where the default shell is
        # PowerShell - and there `"$TAG"` is a PowerShell variable that was never assigned, so it
        # expands to the EMPTY STRING (env vars are `$env:TAG`). gh then looks up a release with no
        # tag and answers "release not found", twice in a row, while the installer it was meant to
        # upload sits finished on disk. Measured on v0.6.0.
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$REPO"

  # The server's executables - one per platform, all six cross-compiled from ONE runner, which is
  # what `bun build --compile --target=…` buys and the tray cannot have (its matrix exists because
  # Tauri needs each platform's own SDK).
  server:
    needs: draft
    runs-on: ubuntu-latest
    # Restated for the reason the tray's block gives: a job-level block replaces the workflow's.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: bun install --frozen-lockfile

      # Rebuilds the browser GUI and embeds it — never a bare `bun build --compile`, which would
      # ship whatever bundle happened to be in the checkout.
      - run: bun run build:server:all

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-binaries
          path: dist/*
          if-no-files-found: error

      # The six executables, attested for the reason the tray's step spells out — and here it also
      # covers the npm channel, which carries these same files: npm attaches its own provenance to
      # the packages, this attests the binaries inside them.
      - if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # `--clobber`, for the reason spelled out in the tray's job: a re-run must not die on its own
      # first run's uploads.
      - if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$REPO"

  # Does what was built actually RUN? All six executables are cross-compiled on the ONE
  # `ubuntu-latest` runner above, so until this job existed the Windows binary and both Linux ARM
  # binaries had never been EXECUTED on any machine, ever. That is the 0.6.0 failure exactly - five
  # green artifacts, dead at startup everywhere but where they were built - and it was invisible
  # from this workflow's own checkmarks, which is why no test could have caught it: the only proof
  # is running the file on the OS it claims to be for.
  #
  # It gates `publish` and `npm` rather than reporting after them. A build that does not start then
  # never leaves the draft and never reaches a registry, where a publish cannot be taken back - the
  # remedy is a new tag, not an explanation owed to a stranger whose download does nothing.
  #
  # On a tag the binary is downloaded from the release, so this also proves the UPLOAD happened -
  # v0.6.0's Windows installer was built and never uploaded. A manual run has no release, so it
  # takes the same files from the run's artifact: the whole matrix is provable without cutting one.
  smoke:
    needs: server
    strategy:
      # Every platform reports. Which ones start is the entire question, and stopping at the first
      # failure would answer it for one of six.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: linux-x64
          - runner: ubuntu-24.04-arm
            asset: linux-arm64
          - runner: macos-latest
            asset: macos-arm64
          # An x64 binary needs an x64 machine, and `macos-latest` is arm64. `macos-13` is no longer
          # offered - the Intel runners are `macos-15-intel` and `macos-26-intel`.
          - runner: macos-15-intel
            asset: macos-x64
          - runner: windows-latest
            asset: windows-x64.exe
          # The machine this job exists for: a Snapdragon laptop runs the arm64 Node from winget,
          # npm resolves the arm64 package, and nothing else in this workflow ever executes that
          # binary. `windows-11-arm` is GA and free on public repositories (2025-08-07); it is the
          # only leg here that would start costing money if this repository went private.
          - runner: windows-11-arm
            asset: windows-arm64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A tag says which version it releases; a manual run has only the manifest. On a tag this is
      # also what catches a forgotten bump: the binary prints the version `package.json` carried
      # when it was compiled, and the smoke script requires the two to be the same string.
      - shell: bash
        env:
          TAG: ${{ github.ref_name }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          if [ "$IS_TAG" = true ]; then
            version=${TAG#v}
          else
            version=$(grep -m1 '"version"' package.json | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Through the environment, never interpolated into the command, for the reason the draft job
      # gives: a ref name is repository input.
      - if: github.ref_type == 'tag'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          ASSET: ${{ matrix.asset }}
        run: gh release download "$TAG" --repo "$REPO" --pattern "seedeep-server_${VERSION}_${ASSET}" --dir bin

      - if: github.ref_type != 'tag'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-binaries
          path: bin

      # `shell: bash` on every platform, Windows included: v0.6.0 uploaded no Windows installer
      # because `"$TAG"` in PowerShell is an unassigned variable that expands to nothing. One
      # script, six platforms, no per-OS dialect to get wrong. What it asserts is in its header.
      - shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: .github/scripts/smoke-server.sh "bin/seedeep-server_${VERSION}_${ASSET}" "$VERSION"

      # STARTING IS NOT SURVIVING, and the step above is seconds of work: a process that dies at
      # t+11s passes it and reaches a stranger. Three starts with a 20-second idle window, each left
      # completely alone, is the REGRESSION - cheap, and on every platform, because nothing says the
      # failure mode belongs to the one architecture where it happened to be seen. The full protocol
      # (ten starts, 40 seconds) lives in `windows`, where there is a measured death to explain and
      # comparability with the arm64 session to keep.
      - shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: .github/scripts/idle-survival.sh "bin/seedeep-server_${VERSION}_${ASSET}" 3 20

      # The DETACHED path - `start`, `status`, `restart`, `stop` - which `serve` never touches and
      # which BRANCHES BY OS: `detached: true` on Windows, its absence (and setsid) everywhere else.
      # Its only other coverage is `open-cmd.test.ts`, which injects its dependencies and so proves
      # the logic while never running the process. Every defect this path has had was found by hand
      # on a VM, including a `restart` that killed the old server and bound nothing.
      #
      # `!cancelled()` rather than the default, so a binary that failed the step above is still
      # driven through the four verbs: two findings in one run beat one finding and a skipped step.
      - if: ${{ !cancelled() }}
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: .github/scripts/server-lifecycle.sh "bin/seedeep-server_${VERSION}_${ASSET}"

  # The Windows x64 binary, on a machine that is not emulating it - and on one that is.
  #
  # `smoke` proves the download is not dead: seconds of work, and it passes long before the failure
  # this job exists for. On a Windows 11 arm64 VM the x64 binary was killed `0xC0000005` three times
  # in eight starts, at about t+11s, silently. The identical source built for arm64 survived ten of
  # ten there, so the fault was blamed on Prism, Windows-on-ARM's x64 emulator - an attribution made
  # by analogy and never measured, while x64 is the architecture most Windows users are on.
  #
  # ONE binary, `windows-x64`, on TWO runners, which is the whole experiment:
  #
  #   windows-latest  - x64 on x64 silicon. If ten starts survive here, the emulator is where the
  #                     fault lives and the binary is cleared on the hardware it ships for.
  #   windows-11-arm  - the SAME x64 binary under Prism, which is the VM's condition reproduced on a
  #                     runner. If the deaths come back here, the experiment is controlled and
  #                     closed; if they never do, the arm64 measurement was about that machine.
  #
  # The Prism leg is an EXPERIMENT and never a gate: its STEPS carry `continue-on-error`, so a death
  # there is reported and blocks nothing. It is emulating an architecture it was not built for, and
  # failing a release over that would be failing it over Microsoft's emulator. The native leg is the
  # opposite - it gates `publish` and `npm` exactly as `smoke` does, because a binary that dies
  # eleven seconds in is a binary nobody can use.
  #
  # On the STEPS and not on the job, for two reasons that both bite. A step whose `continue-on-error`
  # fired concludes SUCCESS, so the steps after it still run - and the one after it here is the
  # lifecycle, which would otherwise be skipped in precisely the scenario this job predicts, the
  # emulated death. And it keeps the gate independent of what a job-level `continue-on-error` means
  # to a `needs` that lists it, which the workflow syntax reference does not spell out: here the job
  # simply succeeds on both legs, and only the native leg's steps can ever fail it.
  #
  # It also covers what `serve` never touches: the DETACHED path (`start`/`status`/`restart`/`stop`),
  # whose every defect so far was found by hand on a VM - including a `restart` that killed the old
  # server and bound nothing, because the port had not been released yet.
  windows:
    needs: server
    strategy:
      # Both legs report. Which of the two dies is the entire question, and stopping at the first
      # would answer it for one.
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: on x64 silicon
          - runner: windows-11-arm
            arch: under Prism emulation
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The same version resolution as `smoke`, for the same reason: a tag names the version it
      # releases, a manual run has only the manifest.
      - shell: bash
        env:
          TAG: ${{ github.ref_name }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          if [ "$IS_TAG" = true ]; then
            version=${TAG#v}
          else
            version=$(grep -m1 '"version"' package.json | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - if: github.ref_type == 'tag'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release download "$TAG" --repo "$REPO" --pattern "seedeep-server_${VERSION}_windows-x64.exe" --dir bin

      - if: github.ref_type != 'tag'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-binaries
          path: bin

      # Ten attempts and a 40-second idle window: the numbers the manual arm64 session used, so the
      # two runs are comparable. Ten because the deaths came at three in eight - a shorter run
      # cannot tell "healthy" from "unlucky".
      - name: Ten starts, each left alone (${{ matrix.arch }})
        shell: bash
        continue-on-error: ${{ matrix.runner == 'windows-11-arm' }}
        run: .github/scripts/idle-survival.sh "bin/seedeep-server_${VERSION}_windows-x64.exe" 10 40

      # The emulated leg only: on `windows-latest` this exact binary has already been driven through
      # the same four verbs by `smoke`, on the same runner. Under Prism it has not, and that is the
      # environment the port race was found in.
      - if: matrix.runner == 'windows-11-arm'
        name: start / status / restart / stop (${{ matrix.arch }})
        shell: bash
        continue-on-error: true
        run: .github/scripts/server-lifecycle.sh "bin/seedeep-server_${VERSION}_windows-x64.exe"

  # The npm channel: the same six executables, each wrapped in a package npm resolves by `os`/`cpu`,
  # under one `seedeep` wrapper whose postinstall puts the binary where `bin` already points. Node is
  # needed to INSTALL, never to run. It exists because a binary that arrives through a package
  # manager is not quarantined - macOS sets that flag in the browser that downloads, not in npm - so
  # this is the one channel with no first-launch refusal to explain.
  #
  # Deliberately NOT a dependency of `publish`: if a publish to npm fails, the release page is still
  # worth having, and the failure is red here where it can be re-run.
  npm:
    # `smoke` gates this one harder than it gates `publish`: a draft release can be deleted, an npm
    # version cannot (unpublish is restricted after 72 hours). A binary that does not start must
    # never reach the registry - and neither must one that starts and dies eleven seconds later,
    # which is `windows`.
    needs: [server, smoke, windows]
    # A tag AND a switch. Publishing to npm cannot be taken back (unpublish is restricted after 72
    # hours), and the FIRST publish of a package has to be manual anyway - a trusted publisher can
    # only be configured on a package that already exists. So every tag builds these packages and
    # publishes none of them until the repository variable `SEEDEEP_NPM_PUBLISH` is set to `true`,
    # which is the moment the account, its 2FA and the trusted publisher are in place.
    #
    # That rule applies again to EVERY platform package added after the first release, one at a
    # time: `seedeep-windows-arm64` is a name nobody owns until it is published by hand, and this
    # job is not a dependency of `publish` - so a tag that finds it missing still produces a green
    # release page beside a channel that did not ship.
    if: github.ref_type == 'tag' && vars.SEEDEEP_NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    # Named in the OIDC token, and the seven trusted publishers on npmjs.com are configured to demand
    # exactly this environment - so the two names are one setting written in two places, and a
    # rename here rejects every publish until the registry side is changed to match. It carries no
    # protection rule today: it is a claim to match, not an approval gate. Adding a required
    # reviewer to the environment is what would turn it into one, and would put a human click in
    # front of every publish to npm - free once the repository is public, a paid plan while private.
    environment: npm-publish
    permissions:
      # Trusted publishing: the OIDC token IS the credential, so no npm token is stored in this
      # repository at all. It also makes npm attach a provenance attestation by itself (npm docs:
      # "This happens by default - you don't need to add the --provenance flag").
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # The executables the `server` job compiled, not a second build of the same tag: what gets
      # published has to be the file that was uploaded to the release, byte for byte.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-binaries
          path: dist

      - run: bun run build:npm

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later (npm's own docs); the runner's Node 22 ships
      # npm 10, which would fall back to looking for a token that does not exist.
      #
      # An exact version, not the `11` range: this step runs in the one job holding `id-token: write`,
      # so whatever it installs is already in position to publish. A range is resolved at run time and
      # can therefore change under a tag that did not; a published version cannot. Same reason the
      # actions above carry a SHA - this is the one dependency here that has no SHA to carry.
      - run: npm install -g npm@11.19.0

      # Platform packages FIRST, and the wrapper last: the wrapper names them at an exact version,
      # and a wrapper on the registry ahead of its binaries is an install that ends in a command
      # which cannot run. The glob expands before the literal, so that order is the shell's own and
      # not a second list to keep in step.
      #
      # A version already on the registry is SKIPPED, not retried - which is what makes this step
      # re-runnable, the property `--clobber` gives the release half of the same tag.
      # npm is immutable ("once published, a package cannot change"), so a run that died partway -
      # a dropped connection on a 40 MB tarball, or a package added since whose trusted publisher
      # nobody configured yet - used to leave the re-run failing on the FIRST package instead of
      # finishing the remaining ones, with the wrapper still naming binaries at a version nobody
      # ever published. `npm view` exits 0 only when that exact version is already there.
      - run: |
          set -euo pipefail
          for dir in dist/npm/seedeep-* dist/npm/seedeep; do
            spec=$(node -p "const p = require('./$dir/package.json'); p.name + '@' + p.version")
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already on the registry"
              continue
            fi
            npm publish "$dir"
          done

  # Flips the draft to published, and is the only step in this repo that puts a binary in front of
  # a stranger. It is a job of its own for two reasons: `needs` will not start it unless EVERY
  # matrix build AND the server's own job succeeded - so a Windows failure, or a server that would
  # not compile, leaves the release a draft rather than publishing half a download page - and it
  # runs once, where the build job runs per platform.
  #
  # A draft is invisible to anyone without push access and is never `releases/latest` (GitHub's REST
  # docs: "Only users with push access will receive listings for draft releases", and the latest
  # release is "the most recent non-prerelease, non-draft release"). So on a public repo an
  # unpublished release means the README's download link leads nowhere - which is what this closes.
  publish:
    # `smoke` is here so a release nobody can start stays a draft: this job is the single step that
    # makes a build visible to strangers, and it is the last place the decision can still be undone.
    # `windows` for the same reason one step later: a binary that starts and then dies unattended is
    # one `smoke` signs off and nobody can use. Only its native leg can hold this back - the Prism
    # leg is `continue-on-error` and reports without gating.
    needs: [tray, server, smoke, windows]
    # Only a tag has a release to publish. A manual run built the same artifacts and attached them
    # to the workflow run, deliberately touching nothing in the repository.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      # Through the environment, never interpolated into the command: a ref name is repository
      # input, and a shell that expands it is a shell that can be told to run something else.
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --repo "$REPO" --draft=false

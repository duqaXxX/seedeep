# Runs on every push and pull request, which is the point: the rules this repo already states in
# CONTRIBUTING.md ("`bun run typecheck` must pass") were enforced by nothing, and the type-checker
# was red on main while every local `bun test` stayed green.
#
# Three jobs rather than one, and they stay separate: a leak is not a reason to stop reporting a
# broken test, nor the reverse, so a red check names what broke without anybody opening a log. Each
# job states its own reason for existing where it is defined.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A branch only needs its latest commit checked; superseded runs are cancelled rather than queued.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Sensitive-data scan
    runs-on: ubuntu-latest
    steps:
      # Full history: the scan diffs against a base commit, which a shallow clone does not have.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The range is computed in the shell and the refs arrive through the environment, never
      # interpolated into the script: a branch name on a pull request from a fork is attacker-
      # controlled text, and `${{ }}` inside a `run:` block would paste it straight into bash.
      - name: Scan the pushed changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            # Three dots: what this branch ADDS since it forked, not every change on the base
            # since then — otherwise a busy main makes each pull request look like it wrote it.
            git diff "origin/$BASE_REF...HEAD"
          elif [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git diff "$BEFORE..$SHA"
          else
            # First push of a branch, or a force-push whose old tip is gone: scan the tip commit.
            git show "$SHA"
          fi | bash .github/scripts/scan-sensitive-diff.sh

  check:
    name: Tests, types, client bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No `bun-version` here on purpose: with none given the action reads `packageManager` from
      # package.json, so all five setup-bun call sites across this workflow and release.yml take
      # their version from one line. It has to be pinned somewhere, because the last step of this
      # job compares the committed bundle byte for byte against a fresh build, and Bun's bundler
      # renames identifiers differently between releases. A floating `latest` turned that gate red
      # on an untouched main the day Bun went 1.4.0 → 1.4.2, which renamed `el8` back to `el`.
      # Raising the pin is therefore a deliberate commit that also rebuilds public/lib/app.js.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: bun install --frozen-lockfile

      # `bun run test`, not `bun test`: the runner skips dot-directories when it scans for test
      # files, so a bare `bun test` silently leaves the gate in .github/scripts/ untested. The
      # script names both roots.
      - run: bun run test

      # Tests do not type-check, so a type error survives a green suite — which is exactly how one
      # lived on main until this workflow existed.
      - run: bun run typecheck

      # Formatting and lint in one pass. It reports rather than rewrites here: CI's job is to say
      # what is wrong, and a pipeline that edits the code under review hides the difference between
      # what an author wrote and what a machine changed.
      - run: bun run lint

      # public/lib/app.js is a BUILT artifact that is nevertheless committed, so that a clone runs
      # the GUI without a build step. That only holds while the committed bytes match the source:
      # rebuild it here and fail if anything moved.
      - name: The committed client bundle matches its source
        run: |
          bun run build:client
          git diff --exit-code -- apps/server/public/lib/app.js \
            || { echo "::error::apps/server/public/lib/app.js is stale — run 'bun run build:client' and commit it"; exit 1; }

  # The tray is Rust, and Rust compiles by PLATFORM: `#[cfg(windows)]` is not merely untested off
  # Windows, it is never handed to the compiler there. `local.rs` alone carries 14 `cfg(unix)`
  # blocks, 4 `cfg(target_os = "macos")` and 5 `cfg(windows)` — and until this job existed, the
  # first two were checked only because development happens on a Mac and somebody ran the tests,
  # while the third was checked by nothing until a tag built the installer. Four changes to those
  # Windows blocks shipped that way (2026-08-15).
  #
  # One job, one matrix, one command. Both legs compile and both run the tests: six of them used to
  # be coupled to a POSIX filesystem — asserting on `/home/dev`, asking whether `/usr/bin/true` is a
  # file — and this job is what found that, on its first run.
  #
  # Linux is absent because the tray has no code there — a non-target by decision, and `release.yml`
  # builds no Linux tray either (`docs/tray.md`).
  tray:
    name: Tray (Rust)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # `stable`, matching release.yml: this must fail for the same reasons the release build does,
      # never for a different toolchain.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: apps/tray/src-tauri

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: bun install --frozen-lockfile

      # `generate_context!()` reads `frontendDist` at COMPILE time and panics when the directory is
      # not there, so the panel has to be bundled before cargo runs — the same `beforeBuildCommand`
      # tauri would run for a real build. A local `cargo test` passes without this only because the
      # directory is already on disk from an earlier build, which is how it went unnoticed until a
      # clean machine ran it.
      - run: bun run build:tray-ui

      # cargo directly rather than `bun run test:tray`: that script's first step guards a
      # contributor's PATH for cargo, which a job that just installed the toolchain does not need.
      - run: cargo test --manifest-path apps/tray/src-tauri/Cargo.toml

    <line x1="11.29" y1="12.47" x2="16" y2="12.47"/>
    <line x1="13.06" y1="16" x2="18.36" y2="16"/>
    <line x1="14.53" y1="19.53" x2="19.83" y2="19.53"/>
  </g>
</svg>